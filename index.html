<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeApp AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>FreeApp AI</h1>
            <p>Build and improve apps from plain-language instructions.</p>
        </header>

        <section class="card">
            <label for="prompt">What should FreeApp AI build or change?</label>
            <textarea id="prompt" rows="9" placeholder="Example: Create an Android app that lets me track expenses..."></textarea>
            <button id="build-button" type="button">Build / Modify App</button>
            <div id="status" class="status" aria-live="polite"></div>
            <pre id="result" aria-live="polite"></pre>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
