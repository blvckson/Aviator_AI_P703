name: Build Aviator AI P703

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show dependencies
        run: gradle :app:dependencies --configuration debugRuntimeClasspath

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare APK A and APK B
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p app/build/outputs/formats
          cp "$APK" app/build/outputs/formats/Aviator_AI_P703_Format_A.apk
          cp "$APK" app/build/outputs/formats/Aviator_AI_P703_Format_B.apk
          ls -lh app/build/outputs/formats/*.apk

      - name: Upload APK A
        uses: actions/upload-artifact@v4
        with:
          name: Aviator_AI_P703_Format_A
          path: app/build/outputs/formats/Aviator_AI_P703_Format_A.apk

      - name: Upload APK B
        uses: actions/upload-artifact@v4
        with:
          name: Aviator_AI_P703_Format_B
          path: app/build/outputs/formats/Aviator_AI_P703_Format_B.apk

# Both deliverables are produced from the same verified build so every detection,
# history-recovery and speed fix is present in APK A and APK B.
