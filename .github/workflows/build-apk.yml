name: Build Ask.Me APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "port/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OCR, narrator, and voice-studio JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.cjs
          node --check public/app.js
          node --check public/voice/app.js
          node --check public/voice/inference-worker.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare the bundled app and local voice studio
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          cp -R public/. app/src/main/assets/

          VOICE_DIR="app/src/main/assets/voice"
          MODEL_DIR="$VOICE_DIR/onnx/english_2026-04"
          ORT_DIR="$VOICE_DIR/ort"
          mkdir -p "$MODEL_DIR" "$ORT_DIR"

          curl -fL --retry 3 -o "$VOICE_DIR/sentencepiece.js" "https://raw.githubusercontent.com/hemanth/pocket-voice/main/sentencepiece.js"
          curl -fL --retry 3 -o "$ORT_DIR/ort.min.js" "https://unpkg.com/onnxruntime-web@1.18.0/dist/ort.min.js"
          curl -fL --retry 3 -o "$ORT_DIR/ort-wasm.wasm" "https://unpkg.com/onnxruntime-web@1.18.0/dist/ort-wasm.wasm"

          BASE="https://huggingface.co/spaces/KevinAHM/pocket-tts-web/resolve/main/onnx/english_2026-04"
          for f in bundle.json tokenizer.model bos_before_voice.npy mimi_encoder_int8.onnx text_conditioner_int8.onnx flow_lm_main_int8.onnx flow_lm_flow_int8.onnx mimi_decoder_int8.onnx; do
            curl -fL --retry 3 -o "$MODEL_DIR/$f" "$BASE/$f"
          done

          for required in \
            "$VOICE_DIR/index.html" \
            "$VOICE_DIR/app.js" \
            "$VOICE_DIR/inference-worker.js" \
            "$VOICE_DIR/sentencepiece.js" \
            "$ORT_DIR/ort.min.js" \
            "$ORT_DIR/ort-wasm.wasm" \
            "$MODEL_DIR/bundle.json" \
            "$MODEL_DIR/tokenizer.model" \
            "$MODEL_DIR/bos_before_voice.npy" \
            "$MODEL_DIR/mimi_encoder_int8.onnx" \
            "$MODEL_DIR/text_conditioner_int8.onnx" \
            "$MODEL_DIR/flow_lm_main_int8.onnx" \
            "$MODEL_DIR/flow_lm_flow_int8.onnx" \
            "$MODEL_DIR/mimi_decoder_int8.onnx"; do
            test -s "$required" || { echo "Missing or empty voice asset: $required"; exit 1; }
          done
          du -sh "$VOICE_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show dependencies
        run: gradle :app:dependencies --configuration debugRuntimeClasspath

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Verify single APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "Built one APK:"
          ls -lh "$APK"

      - name: Upload single Ask.Me APK
        uses: actions/upload-artifact@v4
        with:
          name: AskMe_P703_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
