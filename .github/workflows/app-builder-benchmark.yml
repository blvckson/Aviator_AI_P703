name: Ask.Me App Builder 50-case benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "public/app-builder.js"
      - "tests/app-builder-benchmark.cjs"
      - ".github/workflows/app-builder-benchmark.yml"

permissions:
  contents: read

jobs:
  live-app-builder-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate App Builder JavaScript and regression tests
        run: |
          node --check public/app-builder.js
          node --check tests/app-builder-benchmark.cjs
          node --test tests/app-builder.test.cjs
      - name: Run 50 live generation cases without API token
        run: node tests/app-builder-benchmark.cjs --live
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: askme-app-builder-50-case-report
          path: artifacts/askme-app-builder-benchmark.json
          if-no-files-found: warn
          retention-days: 30
