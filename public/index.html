<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask.Me</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div class="header-row">
        <div>
          <h1>Ask.Me</h1>
          <p>Deep reasoning, live research, screenshots, images and videos.</p>
        </div>
        <button id="narrator-settings-button" class="icon-button" type="button" aria-label="Narrator settings">🎙 Voice Clone</button>
      </div>
      </header>
    <section class="card">
      <label for="prompt">What would you like to ask?</label>
      <textarea id="prompt" rows="8" placeholder="Ask a complex question or attach a screenshot..."></textarea>
      <div class="chat-attachments">
        <button id="attach-button" class="attach-button" type="button" aria-label="Attach image or document" title="Attach image or document">＋</button>
        <input id="image-input" type="file" accept="image/*" multiple hidden>
        <span id="file-status" class="file-status">Attach an image or document</span>
      </div>
      <div id="preview"></div>
      <label class="narrator-toggle" for="narrator-enabled"><input id="narrator-enabled" type="checkbox"> Read answers aloud</label>
      <button id="build-button" type="button">Ask</button>
      <div id="status" class="status" aria-live="polite"></div>
      <div id="result" aria-live="polite"></div>
      <div id="media"></div>
      <div id="sources" class="sources" hidden>
        <strong>Web sources used</strong>
        <ul id="source-list"></ul>
      </div>
    </section>
  </main>

  <div id="narrator-modal" class="modal" hidden>
    <div class="modal-card voice-modal-card" role="dialog" aria-modal="true" aria-labelledby="narrator-title">
      <button id="narrator-close" class="modal-close" type="button" aria-label="Close">×</button>
      <h2 id="narrator-title">Ask.Me Voice Clone</h2>
      <p>Your voice-cloning studio runs locally inside the Ask.Me app. Voice samples are processed on this device; no commercial voice-cloning API is used.</p>
      <iframe id="voice-studio-frame" title="Ask.Me local voice cloning studio" src="voice/index.html"></iframe>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
